<svg xmlns="http://www.w3.org/2000/svg" width="960" height="820" viewBox="0 0 960 820" role="img" aria-labelledby="title desc">
  <title id="title">Claude Account Switcher terminal interface</title>
  <desc id="desc">Illustration with two fictional accounts, five-hour and weekly usage bars, an active account marker, and the keyboard-driven action menu.</desc>
  <defs>
    <linearGradient id="usage" x1="0" x2="1">
      <stop offset="0" stop-color="#5fd75f"/>
      <stop offset="0.125" stop-color="#87d75f"/>
      <stop offset="0.25" stop-color="#afd75f"/>
      <stop offset="0.375" stop-color="#d7d75f"/>
      <stop offset="0.5" stop-color="#ffd75f"/>
      <stop offset="0.625" stop-color="#ffaf5f"/>
      <stop offset="0.75" stop-color="#ff875f"/>
      <stop offset="1" stop-color="#ff5f5f"/>
    </linearGradient>
    <style>
      text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 16px; fill: #e4e2de; }
      .muted { fill: #92928e; }
      .accent { fill: #d89170; }
      .active { fill: #8fc97d; }
      .lime { fill: #afd75f; }
      .orange { fill: #ffaf5f; }
      .red { fill: #ff5f5f; }
      .small { font-size: 14px; }
      .selected { fill: #151515; font-weight: bold; }
    </style>
  </defs>
  <rect width="960" height="820" rx="12" fill="#151515"/>
  <rect width="960" height="38" rx="12" fill="#242424"/>
  <rect y="25" width="960" height="13" fill="#242424"/>
  <circle cx="22" cy="19" r="5" fill="#e87973"/>
  <circle cx="42" cy="19" r="5" fill="#dbbd68"/>
  <circle cx="62" cy="19" r="5" fill="#8fc97d"/>
  <text x="480" y="24" text-anchor="middle" class="muted small">ng-claude-account</text>
  <g class="accent" xml:space="preserve">
    <text x="38" y="72" class="accent">   ____ _                 _</text>
    <text x="38" y="91" class="accent">  / ___| | __ _ _   _  __| | ___</text>
    <text x="38" y="110" class="accent"> | |   | |/ _` | | | |/ _` |/ _ \</text>
    <text x="38" y="129" class="accent"> | |___| | (_| | |_| | (_| |  __/</text>
    <text x="38" y="148" class="accent">  \____|_|\__,_|\__,_|\__,_|\___|</text>
  </g>
  <text x="87" y="177" font-weight="bold">A C C O U N T   S W I T C H E R</text>
  <text x="365" y="198" class="accent small">ng</text>
  <rect x="38" y="220" width="884" height="200" rx="8" fill="none" stroke="#555550"/>
  <rect x="51" y="210" width="119" height="20" fill="#151515"/>
  <text x="60" y="225" class="muted small">ACCOUNTS</text>
  <text x="60" y="252" class="active">● Personal   personal@example.test</text>
  <text x="827" y="252" class="active small">ACTIVE</text>
  <text x="79" y="280" class="muted small">5 h</text>
  <rect x="135" y="269" width="420" height="13" fill="url(#usage)"/>
  <rect x="185.4" y="269" width="369.6" height="13" fill="#353631"/>
  <text x="576" y="281" class="active small">12 %</text>
  <text x="651" y="281" class="muted small">resets 14:30</text>
  <text x="79" y="307" class="muted small">7 d</text>
  <rect x="135" y="296" width="420" height="13" fill="url(#usage)"/>
  <rect x="273.6" y="296" width="281.4" height="13" fill="#353631"/>
  <text x="576" y="308" class="lime small">33 %</text>
  <text x="651" y="308" class="muted small">resets Fri 09:00</text>
  <text x="60" y="350">○ Work       work@example.test</text>
  <text x="79" y="378" class="muted small">5 h</text>
  <rect x="135" y="367" width="420" height="13" fill="url(#usage)"/>
  <rect x="420.6" y="367" width="134.4" height="13" fill="#353631"/>
  <text x="576" y="379" class="orange small">68 %</text>
  <text x="651" y="379" class="muted small">resets 17:00</text>
  <text x="79" y="405" class="muted small">7 d</text>
  <rect x="135" y="394" width="420" height="13" fill="url(#usage)"/>
  <rect x="525.6" y="394" width="29.4" height="13" fill="#353631"/>
  <text x="576" y="406" class="red small">93 %</text>
  <text x="651" y="406" class="muted small">resets Sun 09:00</text>
  <rect x="38" y="448" width="884" height="28" rx="3" fill="#d89170"/>
  <text x="59" y="467" class="selected">&gt; Switch account</text>
  <text x="79" y="495">Account details</text>
  <text x="79" y="523">Renew expired tokens</text>
  <text x="79" y="551">Log in / re-authenticate</text>
  <text x="59" y="591" class="muted">-- Manage --</text>
  <text x="79" y="619">Edit alias</text>
  <text x="79" y="647">Diagnose authentication</text>
  <text x="79" y="675">Restore an account</text>
  <text x="79" y="703">Manage accounts</text>
  <text x="79" y="731">Automation</text>
  <text x="79" y="767">Exit</text>
  <text x="38" y="800" class="muted small">↑/↓ Move    Enter Select    r Refresh usage    Esc Back</text>
</svg>
